favour_debater_task:
  description: >
    You are given a topic and a motion. Your task is to provide arguments in favor of the motion. Summarize your findings in a clear and concise manner.
  expected_output: >
    A list with 3 bullet points of the most relevant information about {topic}
  agent: debater

opposition_debater_task:
  description: >
    You are given a topic and a motion. Your task is to provide arguments against the motion. Summarize your findings in a clear and concise manner.
  expected_output: >
    A list with 3 bullet points of the most relevant information about {topic}
  agent: debater

judge_task:
  description: >
    Review the context you got and expand each topic into a full section for a report.
    Make sure the report is detailed and contains any and all relevant information.
  expected_output: >
    A fully fledged report with the main topics, each with a full section of information.
    Formatted as markdown without '```'
  agent: judge
